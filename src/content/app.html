<emc-navbar id="navbar"></emc-navbar>
<emc-page>
    <emc-paging id="view-pager" active="main">
        <gt-viewchoice id="main-content" slot="main" active="tracker">
            <gt-viewchoice-panel slot="tracker" label="Item & Map Tracker" icon="images/icons/tracker.svg">
                <ootrt-layoutcontainer id="layout-container" layout="map-compact">
                </ootrt-layoutcontainer>
            </gt-viewchoice-panel>
            <gt-viewchoice-panel slot="locations" label="Locations" icon="images/icons/location.svg">
                <gt-locationlist>
                </gt-locationlist>
            </gt-viewchoice-panel>
            <gt-viewchoice-panel slot="maps" label="Maps" icon="images/icons/area.svg">
                <ootrt-worldmap detailed="true">
                </ootrt-worldmap>
            </gt-viewchoice-panel>
            <gt-viewchoice-panel slot="shops" label="Shops" icon="images/icons/shops.svg">
                <ootrt-shoplist>
                </ootrt-shoplist>
            </gt-viewchoice-panel>
            <gt-viewchoice-panel slot="dungeonstate" label="Dungeonstate" icon="images/icons/dungeon.svg">
                <ootrt-dungeonstate orientation="column" active="key,bosskey,map,compass,reward,type,hint">
                </ootrt-dungeonstate>
            </gt-viewchoice-panel>
            <gt-viewchoice-panel slot="exits" label="Exits" icon="images/icons/entrance.svg">
                <gt-exitlist>
                </gt-exitlist>
            </gt-viewchoice-panel>
            <gt-viewchoice-panel slot="songs" label="Songs" icon="images/icons/songs.svg">
                <ootrt-songlist>
                </ootrt-songlist>
            </gt-viewchoice-panel>
            <gt-viewchoice-panel slot="multi" label="Multiplayer" icon="images/icons/multi.svg">
                <ootrt-multiplayer>
                </ootrt-multiplayer>
            </gt-viewchoice-panel>
            <gt-viewchoice-panel slot="notes" label="Notes" icon="images/icons/notes.svg">
                <gt-texteditor id="notes-editor" title="Notes">
                </gt-texteditor>
            </gt-viewchoice-panel>
        </gt-viewchoice>
        <jse-choice id="editor-choice" slot="editor_choice"></jse-choice>
    </emc-paging>
</emc-page>
<footer class="footer">
    <ootrt-locationstate>
    </ootrt-locationstate>
</footer>

<div id="busy-animation"></div>
