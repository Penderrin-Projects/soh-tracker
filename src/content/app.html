<emc-navbar id="navbar"></emc-navbar>
<emc-page>
    <emc-paging id="view-pager" active="main">
        <gt-viewchoice id="main-content" slot="main" active="tracker">
            <div slot="tracker" data-title="Item & Map Tracker" data-icon="images/icons/tracker.svg">
                <emc-ctxmenulayer>
                    <ootrt-layoutcontainer id="layout-container" layout="map-compact">
                    </ootrt-layoutcontainer>
                </emc-ctxmenulayer>
            </div>
            <div slot="maps" data-title="Maps" data-icon="images/icons/area.svg">
                <emc-ctxmenulayer>
                    <ootrt-worldmap>
                    </ootrt-worldmap>
                </emc-ctxmenulayer>
            </div>
            <div slot="shops" data-title="Shops" data-icon="images/icons/shops.svg">
                <emc-ctxmenulayer>
                    <ootrt-shoplist>
                    </ootrt-shoplist>
                </emc-ctxmenulayer>
            </div>
            <div slot="dungeonstate" data-title="Dungeonstate" data-icon="images/icons/dungeon.svg">
                <emc-ctxmenulayer>
                    <ootrt-dungeonstate orientation="column" active="key,bosskey,map,compass,reward,type,hint">
                    </ootrt-dungeonstate>
                </emc-ctxmenulayer>
            </div>
            <div slot="exits" data-title="Exits" data-icon="images/icons/entrance.svg">
                <emc-ctxmenulayer>
                    <gt-exitlist>
                    </gt-exitlist>
                </emc-ctxmenulayer>
            </div>
            <div slot="songs" data-title="Songs" data-icon="images/icons/songs.svg">
                <emc-ctxmenulayer>
                    <ootrt-songlist>
                    </ootrt-songlist>
                </emc-ctxmenulayer>
            </div>
            <div slot="multi" data-title="Multiplayer" data-icon="images/icons/multi.svg">
                <emc-ctxmenulayer>
                    <ootrt-multiplayer>
                    </ootrt-multiplayer>
                </emc-ctxmenulayer>
            </div>
            <div slot="notes" data-title="Notes" data-icon="images/icons/notes.svg">
                <emc-ctxmenulayer>
                    <gt-texteditor id="notes-editor" title="Notes">
                    </gt-texteditor>
                </emc-ctxmenulayer>
            </div>
        </gt-viewchoice>
        <jse-choice id="editor-choice" slot="editor_choice"></jse-choice>
    </emc-paging>
</emc-page>
<footer class="footer">
    <ootrt-locationstate>
    </ootrt-locationstate>
</footer>

<div id="busy-animation"></div>
