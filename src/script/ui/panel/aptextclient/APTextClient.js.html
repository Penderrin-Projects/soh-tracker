<emc-panel-tabpanel id="ap-tabs">
    <div category="ap-log">
        <div class="container">
            <div class="filter-bar">
                <emc-input-search id="ap-log-search" placeholder="Search" nohover></emc-input-search>
            </div>
            <ootrt-chatlist id="ap-log" autoscroll></ootrt-chatlist>
        </div>
    </div>
    <div category="hints">
        <div class="container">
            <div class="filter-bar">
                <emc-input-search id="ap-hints-search" placeholder="Search..." nohover></emc-input-search>
                <emc-select-token id="ap-hints-direction" placeholder="Direction" nohover chooseonly multiple value="[&quot;sender&quot;,&quot;reciever&quot;]">
                    <option value="sender" label="Sender"></option>
                    <option value="reciever" label="Reciever"></option>
                </emc-select-token>
                <emc-select-token id="ap-hints-status" placeholder="Status" nohover chooseonly multiple value="[&quot;found&quot;,&quot;missing&quot;]">
                    <option value="found" label="Found"></option>
                    <option value="missing" label="Not found"></option>
                </emc-select-token>
            </div>
            <emc-datagrid id="ap-hints" stretched="location">
                <emc-datagrid-column name="finder" label="Finder" type="text" sortable width="300"></emc-datagrid-column>
                <emc-datagrid-column name="item" label="Item" type="text" sortable width="400"></emc-datagrid-column>
                <emc-datagrid-column name="reciever" label="Reciever" type="text" sortable width="300"></emc-datagrid-column>
                <emc-datagrid-column name="location" label="Location" type="text" sortable width="400"></emc-datagrid-column>
                <emc-datagrid-column name="entrance" label="Entrance" type="text" sortable width="300"></emc-datagrid-column>
                <emc-datagrid-column name="found" label="Found" type="boolean" sortable width="120"></emc-datagrid-column>
            </emc-datagrid>
        </div>
    </div>
    <!--
            DataGrid [Finder, Reciever, Item, Location, Game, Entrance, Found]
            - search
            - sort by [Finder, Reciever, Item, Location, Game, Entrance, Found]
            - filter by finder/reciever is current user, filter found
        -->
    </div>
</emc-panel-tabpanel>
<emc-input-string id="chat-input" placeholder="Command" nohover autocomplete="off"></emc-input-string>
<!--
    [Hint Item Button]
    - custom item grid with item-categories and items
    - on category/item click fill chat with "hint" message and wait for user to send
    [Hint Location Button]
    - search field
    - datalist with 10 entries max to "force" search
    - on location click fill chat with "hint_location" message and wait for user to send
    -> locations in locationlist/-map should also get a "AP hint location" entry for contextmenu
-->
<!--
    [StringInput for Chat/Commands][Send Button] -> also send by pressing "enter"
-->
