<emc-panel-tabpanel id="ap-tabs">
    <div category="ap-log">
        <div class="container">
            <ootrt-chatlist id="ap-log" autoscroll></ootrt-chatlist>
        </div>
    </div>
    <div category="hints">
        <div class="container">
            <emc-datagrid id="ap-hints" stretched="location">
                <emc-datagrid-column name="finder" caption="Finder" type="string" sortable width="300"></emc-datagrid-column>
                <emc-datagrid-column name="item" caption="Item" type="string" sortable width="400"></emc-datagrid-column>
                <emc-datagrid-column name="reciever" caption="Reciever" type="string" sortable width="300"></emc-datagrid-column>
                <emc-datagrid-column name="location" caption="Location" type="string" sortable width="400"></emc-datagrid-column>
                <emc-datagrid-column name="entrance" caption="Entrance" type="string" sortable width="300"></emc-datagrid-column>
                <emc-datagrid-column name="found" caption="Found" type="boolean" sortable width="120"></emc-datagrid-column>
            </emc-datagrid>
        </div>
        <!--
            DataGrid [Finder, Reciever, Item, Location, Game, Entrance, Found]
            - search
            - sort by [Finder, Reciever, Item, Location, Game, Entrance, Found]
            - filter by finder/reciever is current user, filter found
        -->
    </div>
</emc-panel-tabpanel>
<emc-input-string id="chat-input" placeholder="Command" nohover autocomplete="false"></emc-input-string>
<!--
    [Hint Item Button]
    - custom item grid with item-categories and items
    - on category/item click fill chat with "hint" message and wait for user to send
    [Hint Location Button]
    - search field
    - datalist with 10 entries max to "force" search
    - on location click fill chat with "hint_location" message and wait for user to send
    -> locations in locationlist/-map should also get a "AP hint location" entry for contextmenu
-->
<!--
    [StringInput for Chat/Commands][Send Button] -> also send by pressing "enter"
-->
